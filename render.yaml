services:
  - type: web
    name: servidor-aes-lab
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: BEARER_TOKEN
        sync: false
      - key: AES_KEY_HEX
        sync: false
      - key: AES_IV_HEX
        sync: false
